# Selected-LiDAR navigation runs (v2 terrain -> Nav2): the sim streams native chunks and
# never drives; Nav2 commands through cmd_vel. Use with lunaryard and archive; start only the
# simulator service (the dev stack runs in astrobot-selected-dev). Tear down with stop + rm.
services:
  astrobot-sim:
    environment:
      DISPLAY: ""
      OMNILRS_HEADLESS: "true"
      OMNILRS_DISABLE_VIEWPORT_UPDATES: "true"
      OMNILRS_ENVIRONMENT: lunaryard_40m
      OMNILRS_ENVIRONMENT_SEED: ${OMNILRS_ENVIRONMENT_SEED:-43}
      OMNILRS_ROCKS_ENABLED: "true"
      OMNILRS_NATURAL_HOLDOUT: "false"
      OMNILRS_SELECTED_NAV: "true"
      OMNILRS_SELECTED_LIDAR: "true"
      ASTROBOT_SELECTED_LIDAR_PROFILE: selected_optical_v2
      OMNILRS_PHYSICS_IMU: "true"
      OMNILRS_GT_TF_ENABLED: "false"
      OMNILRS_GT_MAP_ENABLED: "true"
      OMNILRS_RESOURCE_ENABLED: ${OMNILRS_RESOURCE_ENABLED:-false}
      OMNILRS_RESOURCE_MODE: ${OMNILRS_RESOURCE_MODE:-deterministic}
      OMNILRS_RESOURCE_CENTERS: ${OMNILRS_RESOURCE_CENTERS:-}
      OMNILRS_CAMERA_ENABLED: "false"
      OMNILRS_TERRAIN_GT_PROBE: "false"
      OMNILRS_TERRAIN_CALIBRATION: "false"
      OMNILRS_TERRAIN_DRIVE: "false"
      OMNILRS_TERRAIN_NATIVE_PUBLISH: "true"
      OMNILRS_TERRAIN_NATIVE_CAPTURE: "false"
      OMNILRS_TERRAIN_SHADOW: "false"
