# v2 terrain Nav2 parameters (slam_stack:=v2). Identical to nav2_phase3_bev.yaml except the map
# sources: global StaticLayer <- /terrain_shadow/global_costmap (mosaic of the v2 planner windows;
# the window alone limits global goals to ~2.5 m, decision note item 4), Smac allow_unknown for
# exploration goals; local StaticLayer <- /terrain_shadow/planner_costmap (the 6 m window around
# the rover, cropped from the mosaic in nav so remembered obstacles stay lethal); two goal checkers.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Launch overrides both (phase3: navigate_to_pose_lunar_recovery.xml). With two goal
    # checkers every FollowPath must name one: v2 gates also pass nav_through_poses_bt_xml.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - spin_error_code
      - backup_error_code

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    local_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.65
      yaw_goal_tolerance: 6.28
    # return_home only: with home_approach_radius_m 0.5 the rover ends <= 0.85 m from home.
    # 0.35 on every goal halved explore goal success in seed 411's rock field (Oct 28).
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28
    # MPPI sampling-based controller (replaces RotationShim+RPP). Plans smooth
    # trajectories directly, including in-place rotation, with no rotation shim;
    # TwirlingCritic discourages getting stuck spinning. Tuned for a slow
    # (vx<=0.18) skid-steer rover. NOTE: MPPI is CPU-heavy — verify it sustains
    # controller_frequency (10 Hz) in-container; if not, drop batch_size/time_steps.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.1
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.18
      vx_min: -0.05
      wz_max: 0.8
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        critical_cost: 80.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.35
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true  # exploration goals beyond observed cells
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 14.0
      smooth_path: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.10
      track_unknown_space: true
      footprint: "[[0.495, 0.335], [0.495, -0.335], [-0.495, -0.335], [-0.495, 0.335]]"
      footprint_padding: 0.10
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /terrain_shadow/global_costmap
        map_subscribe_transient_local: false
        trinary_costmap: false
        lethal_cost_threshold: 100
        unknown_cost_value: -1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Keep a conservative local clearance margin for rocks. The rover can
        # high-center before the BEV obstacle core reaches the footprint, so
        # inflated shoulders are treated as expensive by MPPI and Smac.
        # MUST be >= the robot circumscribed radius (0.737m = footprint corner
        # sqrt(0.595^2+0.435^2) with 0.10 padding); below it, Nav2 disables the
        # potential-field collision optimization -> a computeCircumscribedCost
        # ERROR flood that chokes the controller (was set to 0.60 -> stalled the
        # seed-42 return). The mapper's own inflation is now 0 (phase2_slam), so
        # this single layer owns clearance; the hard collision bound is the
        # footprint either way -- inflation only adds the soft avoidance band.
        cost_scaling_factor: 2.0
        inflation_radius: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # The local costmap is also backed by the persistent SLAM BEV static map.
      # Keep it in map frame so the StaticLayer samples the BEV grid directly;
      # using odom left the controller with mostly free/unknown local costs in
      # rock corridors while the global planner saw the map.
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      resolution: 0.10
      # the v2 window is 6 x 6 m; cells beyond it would only ever be unknown
      width: 6
      height: 6
      rolling_window: true
      track_unknown_space: true
      footprint: "[[0.495, 0.335], [0.495, -0.335], [-0.495, -0.335], [-0.495, 0.335]]"
      footprint_padding: 0.10
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # In nav the publisher sends this window cropped from its persistent mosaic, so
        # obstacles out of the front LiDAR's view (behind the rover) stay in MPPI's costmap.
        map_topic: /terrain_shadow/planner_costmap
        map_subscribe_transient_local: false
        trinary_costmap: false
        lethal_cost_threshold: 100
        unknown_cost_value: -1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match the global costmap clearance margin; local MPPI should avoid
        # inflated shoulders, not only lethal obstacle cores.
        cost_scaling_factor: 2.0
        inflation_radius: 0.75

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.8]
    min_velocity: [-0.18, 0.0, -0.8]
    max_accel: [0.25, 0.0, 1.0]
    max_decel: [-0.4, 0.0, -1.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
