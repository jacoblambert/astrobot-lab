command_mux:
  ros__parameters:
    use_sim_time: true
    default_mode: auto
    publish_rate_hz: 20.0
    nav_timeout_sec: 0.5
    teleop_timeout_sec: 0.5
    max_linear_x: 0.30
    max_angular_z: 1.50
    linear_scale: 1.0
    angular_scale: 1.5
    angular_scale_positive: 0.0
    angular_scale_negative: 0.0
    max_linear_accel: 0.20
    max_angular_accel: 0.80
