services:
  astrobot-sim:
    image: isaac-sim-omnilrs:latest
    container_name: astrobot-sim-lunaryard
    runtime: nvidia
    networks:
      - ros2
    ipc: host
    privileged: true
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - OMNILRS_ENVIRONMENT=${OMNILRS_ENVIRONMENT:-lunaryard_40m}
      - OMNILRS_ENVIRONMENT_SEED=${OMNILRS_ENVIRONMENT_SEED:-42}
      - OMNILRS_HEADLESS=${OMNILRS_HEADLESS:-true}
      - OMNILRS_ROCKS_ENABLED=${OMNILRS_ROCKS_ENABLED:-}
      - OMNILRS_GT_TF_ENABLED=${OMNILRS_GT_TF_ENABLED:-true}
      # Camera (RGB+depth, 2 RTX-raytraced streams). Default ON again: GLIM moved
      # to CPU (2026-06-03), freeing the GPU for Isaac, so the camera no longer
      # competes with SLAM for GPU compute. Set false to reclaim max GPU/VRAM
      # headroom on the 8GB GPU for large/multi-robot scenes.
      - OMNILRS_CAMERA_ENABLED=${OMNILRS_CAMERA_ENABLED:-true}
      - OMNILRS_RESOURCE_ENABLED=${OMNILRS_RESOURCE_ENABLED:-true}
      - OMNILRS_RESOURCE_MODE=${OMNILRS_RESOURCE_MODE:-deterministic}
      - OMNILRS_RESOURCE_SEED=${OMNILRS_RESOURCE_SEED:-4242}
      - OMNILRS_RESOURCE_LAYERS=${OMNILRS_RESOURCE_LAYERS:-water}
      - OMNILRS_RESOURCE_RANDOM_GAUSSIANS=${OMNILRS_RESOURCE_RANDOM_GAUSSIANS:-3}
      - OMNILRS_RESOURCE_RANDOM_SIGMA_MIN=${OMNILRS_RESOURCE_RANDOM_SIGMA_MIN:-3.5}
      - OMNILRS_RESOURCE_RANDOM_SIGMA_MAX=${OMNILRS_RESOURCE_RANDOM_SIGMA_MAX:-7.5}
      - OMNILRS_RESOURCE_CENTERS=${OMNILRS_RESOURCE_CENTERS:-}
      - ASTROBOT_ROBOT_NAMESPACE=${ASTROBOT_ROBOT_NAMESPACE:-astrobot_0}
      - ROS_DOMAIN_ID=177
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///config/cyclonedds_config.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./OmniLRS:/workspace/omnilrs:rw
      - ./docker:/workspace/astrobot-lab/docker:ro
      - ./config:/config:ro
      - isaac-kit-cache:/isaac-sim/kit/cache:rw
      - isaac-ov-cache:/root/.cache/ov:rw
      - isaac-pip-cache:/root/.cache/pip:rw
      - isaac-gl-cache:/root/.cache/nvidia/GLCache:rw
      - isaac-compute-cache:/root/.nv/ComputeCache:rw
      - isaac-logs:/root/.nvidia-omniverse/logs:rw
      - isaac-data:/root/.local/share/ov/data:rw
      - isaac-documents:/root/Documents:rw
      - isaac-history:/commandhistory:rw
    command:
      - bash
      - -lc
      - /workspace/astrobot-lab/docker/run_omnilrs.sh
    restart: unless-stopped
    tty: true
    stdin_open: true

  astrobot-dev:
    image: astrobot-dev:latest
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: astrobot-dev-lunaryard
    runtime: nvidia
    user: root
    networks:
      - ros2
    ipc: host
    privileged: true
    depends_on:
      - astrobot-sim
    environment:
      - ROS_DOMAIN_ID=177
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///config/cyclonedds_config.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ASTROBOT_AUTO_BUILD=${ASTROBOT_AUTO_BUILD:-true}
      - ASTROBOT_BUILD_SOURCE_GLIM=${ASTROBOT_BUILD_SOURCE_GLIM:-false}
      - ASTROBOT_ROBOT_NAMESPACE=${ASTROBOT_ROBOT_NAMESPACE:-astrobot_0}
    ports:
      # Bound on all interfaces so the console/Foxglove are reachable from other
      # machines too (8765 = foxglove_bridge ws, 8080 = astrobot console backend).
      - "8765:8765"
      - "8080:8080"
    volumes:
      - ./:/workspace/astrobot-lab:rw
      - ./OmniLRS:/workspace/omnilrs:rw
      - ./config:/config:ro
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  ros2:
    driver: bridge

volumes:
  isaac-kit-cache:
  isaac-ov-cache:
  isaac-pip-cache:
  isaac-gl-cache:
  isaac-compute-cache:
  isaac-logs:
  isaac-data:
  isaac-documents:
  isaac-history:
